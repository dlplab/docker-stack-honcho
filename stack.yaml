# Honcho (plastic-labs) — API + deriver + Redis, external PostgreSQL 18/pgvector
# Upstream: https://github.com/plastic-labs/honcho (pinned v3.4.0, 2026-10-20)
# Deploy:   Portainer > Stacks > Repository (dlplab/docker-stack-honcho, stack.yaml)
# Depends:  stack dlplab/docker-stack-postgres (network `postgres`, DB/role `honcho`,
#           extensions vector, pg_trgm, btree_gin pre-created by superuser)
# Env vars: see .env.example
# Hermes:   baseUrl https://${FQDN_HONCHO}, apiKey = admin JWT (see README)

name: honcho

# Shared by api and deriver — both need the full config (upstream uses one env_file)
x-honcho-env: &honcho-env
  DB_CONNECTION_URI: ${DB_CONNECTION_URI:?DB_CONNECTION_URI is required}
  CACHE_ENABLED: "true"
  CACHE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@honcho-redis:6379/0?suppress=true
  AUTH_USE_AUTH: ${AUTH_USE_AUTH:-true}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
  LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
  LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
  LLM_GEMINI_API_KEY: ${LLM_GEMINI_API_KEY:-}
  VECTOR_STORE_TYPE: pgvector
  VECTOR_STORE_MIGRATED: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_ENABLED: "false"
  METRICS_ENABLED: "false"
  TELEMETRY_ENABLED: "false"
  DERIVER_ENABLED: ${DERIVER_ENABLED:-true}
  DERIVER_FLUSH_ENABLED: ${DERIVER_FLUSH_ENABLED:-false}
  SUMMARY_ENABLED: ${SUMMARY_ENABLED:-true}
  PEER_CARD_ENABLED: ${PEER_CARD_ENABLED:-true}
  DREAM_ENABLED: ${DREAM_ENABLED:-true}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  honcho-api:
    image: ghcr.io/plastic-labs/honcho:v3.4.0
    container_name: honcho-api
    hostname: honcho-api
    restart: unless-stopped
    # Runs migrations (advisory-locked) then starts the API
    entrypoint: ["sh", "docker/entrypoint.sh"]
    environment:
      <<: *honcho-env
      API_WORKERS: ${API_WORKERS:-1}
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.honcho-https.entrypoints=websecure
      - traefik.http.routers.honcho-https.rule=Host(`${FQDN_HONCHO:?FQDN_HONCHO is required}`)
      - traefik.http.routers.honcho-https.service=honcho-svc
      - traefik.http.routers.honcho-https.tls=true
      - traefik.http.routers.honcho-https.tls.certresolver=route53
      - traefik.http.services.honcho-svc.loadbalancer.server.port=8000
    depends_on:
      honcho-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - honcho
      - postgres
      - frontend
    logging: *logging

  honcho-deriver:
    image: ghcr.io/plastic-labs/honcho:v3.4.0
    container_name: honcho-deriver
    hostname: honcho-deriver
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment:
      <<: *honcho-env
    depends_on:
      honcho-api:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    networks:
      - honcho
      - postgres
    logging: *logging

  honcho-redis:
    image: redis:8.2-alpine
    container_name: honcho-redis
    hostname: honcho-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - honcho_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - honcho
    logging: *logging

volumes:
  honcho_redis_data:
    name: honcho_redis_data

networks:
  honcho:
    name: honcho
  postgres:
    external: true
    name: postgres
  frontend:
    external: true
    name: frontend
